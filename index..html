<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index.html</title>
    <link rel="stylesheet" href="style2eys.css">
</head>
<body>
    
    <div class="caixa_externa">
    <h1 class="font_color"><i>Cadastro</i></h1>
    <label class="font_color" for="nome">Nome:</label>
    <br>
    <input type="text" id="nome" placeholder="Digite seu nome">
    <br>
    <br>
    <label class="font_color" for="email">E-mail:</label>
    <br>
    <input type="email" id="email" placeholder="Digite seu e-mail">
    <br>
    <br>
    <label class="font_color" for="senha">Senha:</label>
    <br>
    <input type="password" id="senha" placeholder="Digite sua senha">
    <br>
    <br>
    <label class="font_color" for="data_nascimento">Data de Nascimento:</label>
    <br>
    <input type="date" id="data_nascimento" placeholder="digite a sua data de nascimento">
    <br>
    <br>
    <label class="font_color" for="genero">Gênero:</label>
    <br>
    <select name="genero" id="genero"> 
        <option value="selecione" disabled selected>selecione</option>
        <option value="masculino">masculino</option>
        <option value="feminino">feminino</option>
        <option value="prefiro não informar">prefiro não informar</option>
    </select>
    <br>
    <br>
    <label class="font_color" for="aceito os termos">aceito os termos</label>
    <input type="checkbox" id="aceito os termos "> 
    <label class="font_color" for="termo_uso"> <a href="termo_uso.html">termo de uso</a></label>
    <br>
    <br>
    <button class="button">cadastrar</button>
</body>
</html>
